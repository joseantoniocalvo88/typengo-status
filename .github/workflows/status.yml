# Copy into a SEPARATE public status-only repository under .github/workflows/status.yml.
# Never place this workflow in the main CMS repository.
name: TypeNGo independent status
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.mjs'
      - '*.html'
      - '*.css'
      - '.github/workflows/status.yml'
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: read
concurrency:
  group: independent-status
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      new_incident: ${{ steps.events.outputs.new_incident }}
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run monitor tests
        run: node --test tests.mjs
      - name: Locate preceding status artifact
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=typengo-status-history&per_page=20" --jq '[.artifacts[] | select(.expired == false and .workflow_run.id != null)] | sort_by(.created_at) | last // empty')
          if test -n "$artifact"; then
            echo "id=$(jq -r '.id' <<< "$artifact")" >> "$GITHUB_OUTPUT"
            echo "run_id=$(jq -r '.workflow_run.id' <<< "$artifact")" >> "$GITHUB_OUTPUT"
          fi
      - name: Download preceding samples
        if: steps.previous.outputs.id != ''
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          artifact-ids: ${{ steps.previous.outputs.id }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run_id }}
          path: previous
      - name: Verify restored history
        if: steps.previous.outputs.id != ''
        run: |
          test -s previous/status-history.json
          jq -e '.version == 2 and (.samples | length > 0)' previous/status-history.json
      - name: Probe public HTTP components and prepare static site
        env:
          TYPENGO_HEALTH_URL: https://typengo.com/api/health
        run: |
          mkdir -p site
          if test -f previous/status-history.json; then cp previous/status-history.json site/status-history.json; fi
          node collect.mjs site/status-history.json
          cp index.html style.css app.mjs model.mjs monitor.mjs site/
      - name: Detect newly confirmed incidents
        id: events
        run: |
          jq -r '"new_incident=" + (any(.[]; .state == "investigating") | tostring)' site/events.json >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: typengo-status-history
          path: site/status-history.json
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    runs-on: ubuntu-latest
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  incident_notification:
    runs-on: ubuntu-latest
    needs: [collect, deploy]
    if: ${{ needs.collect.outputs.new_incident == 'true' }}
    permissions: {}
    steps:
      - name: Signal newly confirmed incident through GitHub Actions
        run: |
          echo "::error::A new HTTP incident was confirmed. See https://status.typengo.com/ for details."
          exit 1
